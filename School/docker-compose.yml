version: '3'  # Use a supported version (3.7 or later)

volumes:
  # Descriptive volume names for persistence
  postgres_data:
  media_volume:

networks:
  my_network:
    driver: bridge

services:
  web_1:
    build: .
    command: gunicorn --bind 0.0.0.0:8000 School.wsgi:application
    volumes:
      - .:/app
      - media_volume:/app/media  # Mount media volume if needed
    environment:
      # ... other environment variables (consider using a .env file)
      DATABASE_URL: postgres://tasim:tasim*#2024@postgres_1:5432/project101
    ports:
      - "8000:8000"
    depends_on:
      - postgres_1
    restart: unless-stopped
    networks:
      - my_network

  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - "8080:80"
    environment:
      # Consider using a .env file for sensitive information
      PGADMIN_DEFAULT_EMAIL: we@admin.com
      PGADMIN_DEFAULT_PASSWORD: secret*#123  # Update with a strong password
    restart: unless-stopped
    networks:
      - my_network

  postgres_1:
    image: postgres:latest
    environment:
      POSTGRES_DB: project101
      POSTGRES_USER: tasim
      POSTGRES_PASSWORD: tasim*#2024  # Update with a strong password
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Persist data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - my_network
